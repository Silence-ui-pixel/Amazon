<!doctype html>
<html lang="zh-CN">
<head>

<title>关键词库 · 操作顺序预览</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#21323e;background:#f3f6f7;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}header{height:70px;background:white;border-bottom:1px solid #e0e7e8;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:15px}.brand{font-size:18px;font-weight:700}.brand span{color:#168172}.badge{display:inline-block;border-radius:20px;padding:5px 10px;background:#eaf5f0;color:#28765f;font-size:12px}.muted{color:#73838e;font-size:13px}main{max-width:1390px;padding:28px 32px;margin:auto}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:24px;margin:0 0 8px}h2{font-size:22px;margin:9px 0}h3{font-size:15px;margin:0 0 12px}p{line-height:1.75;margin:8px 0}.current{background:#e8f3f0;border:1px solid #c6ded5;border-radius:12px;padding:19px 23px;display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.current strong{display:block;font-size:17px;margin:6px 0}.primary{background:#16776a;color:white;border:1px solid #16776a;border-radius:7px;padding:11px 19px}.secondary{border:1px solid #cdd9dc;background:white;color:#425963;border-radius:7px;padding:10px 15px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}aside{background:white;border:1px solid #e0e7e8;border-radius:12px;padding:18px 12px;position:sticky;top:18px}.group{font-size:11px;letter-spacing:1px;color:#7e909a;padding:11px 12px 8px}.step{width:100%;display:flex;align-items:center;text-align:left;gap:11px;border:0;background:white;border-radius:8px;padding:12px;color:#4c626e;margin:3px 0}.step.active{background:#eaf4f1;box-shadow:inset 3px 0 #168172;color:#146d60}.number{border:1px solid #cfdadc;border-radius:50%;width:25px;height:25px;display:grid;place-items:center;font-size:12px;flex-shrink:0}.done .number{background:#e1f2ea;color:#207655;border:0}.step strong{font-size:13px;display:block;margin-bottom:4px}.step small{font-size:11px;color:#83929b}.workspace{background:white;border:1px solid #e0e7e8;border-radius:12px;overflow:hidden}.panel-head{padding:25px 29px;border-bottom:1px solid #edf0f1}.eyebrow{font-size:11px;color:#208273;letter-spacing:1px}.content{padding:25px 29px}.flow{display:flex;gap:8px;margin:20px 0 24px;flex-wrap:wrap}.flow span{padding:7px 12px;background:#f0f4f5;border-radius:6px;font-size:12px;color:#6c808a}.flow .focus{background:#e6f3ed;color:#176d58}.box{border:1px solid #dfe7e8;border-radius:9px;padding:20px;margin-bottom:17px}.box.soft{background:#f8fafb}.box-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{border-left:3px solid #e3b565;background:#fffaf1;padding:10px 14px;color:#826737;margin:17px 0;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:block;color:#627882;font-size:12px}.field input,.field select,.field textarea{margin-top:8px;padding:10px;border:1px solid #d6e0e2;border-radius:6px;width:100%;background:white;color:#324c58}.check{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eef2f3}.check:last-child{border:0}.check input{accent-color:#16776a}.footer{padding:19px 29px;background:#fafcfc;border-top:1px solid #e5ebed;display:flex;align-items:center;justify-content:space-between;gap:12px}details{border-top:1px solid #e6edef;padding:16px 0;color:#617883}summary{cursor:pointer;font-size:13px}details p{font-size:12px;padding:7px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.channel{border:1px solid #dce5e7;border-radius:8px;padding:18px}.channel b{display:block;margin:9px 0}.progress{height:5px;background:#e1e8e8;border-radius:5px;margin:16px 0}.progress i{display:block;height:100%;background:#248b77;border-radius:5px}.toast{background:#253e46;color:white;position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:13px 20px;border-radius:8px;display:none;z-index:3}.preview{font-size:12px;color:#8b692a;background:#fff6df;border:1px solid #f0dfb5;padding:6px 10px;border-radius:5px}.metric{font-size:24px;color:#1a7564}.mode{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mode select{padding:7px;border:1px solid #d3dfe1;border-radius:6px;background:white}.mobile-label{display:none}@media(max-width:800px){header{padding:12px 18px;height:auto;flex-wrap:wrap}main{padding:20px 14px}.layout{grid-template-columns:1fr}aside{position:static;display:flex;overflow:auto;padding:8px}.group{display:none}.step{min-width:165px}.title{align-items:flex-start;gap:15px;flex-direction:column}.current{padding:16px}.current strong{font-size:14px}.panel-head,.content{padding:20px}.grid,.cards{grid-template-columns:1fr}.footer{padding:18px}.preview{font-size:11px}.brand{font-size:16px}}
</style>
</head>
<body>
<header><div class="brand"><span>◈</span> 关键词库工作台</div><span class="preview">交互布局预览 · 模拟数据 · 不发起采集</span><a class="muted" href="/">返回当前系统 ↗</a></header>
<main>
<div class="title"><div><h1>哑铃架关键词研究</h1><span class="muted">美国站 US　／　B0CGV33WDY　／　ABA 报告周截至 2026-10-17</span></div><div class="mode"><label class="muted" for="scenario">体验场景</label><select id="scenario"><option value="3">待确认竞对</option><option value="1">从头开始</option><option value="4">正在自动采集</option><option value="6">待审核清洗</option><option value="8">待发布词库</option></select><button class="secondary" id="reset">重置预览</button></div></div>
<div class="current" id="current"></div>
<div class="layout"><aside aria-label="八步操作导航" id="nav"></aside><section class="workspace" id="panel" aria-live="polite"></section></div>
<p class="muted" style="margin-top:18px">操作原则：系统自动完成采集与计算；需要你确认时明确暂停。查看历史步骤不会丢弃当前草稿。</p>
</main><div class="toast" role="status" id="toast"></div>
<script>
const steps=[
{title:'确认商品与词根',group:'01　准备与确认',desc:'先确认识别到的商品资料，再核验并保存最小商品词根。',action:'保存词根，进入核心大词',flow:['确认商品资料','核验词根','保存选择'],result:'已保存商品资料与 2 个最小词根'},
{title:'确定核心大词',desc:'读取所选 ABA 周报，分析候选，再保存要继续拓词的核心大词。',action:'保存核心大词，进入竞对',flow:['读取 ABA 周报','分析候选','保存核心词'],result:'已确认 3 个核心大词'},
{title:'筛选竞对 ASIN',desc:'核对候选商品的款式、价格与相关性，明确保留或排除后保存。',action:'保存竞对，进入数据采集',flow:['发现候选','核对商品','保存竞对'],result:'已保存 4 个保留竞对'},
{title:'ABA 正反向拓词',group:'02　两路数据采集',desc:'按核心词与竞对 ASIN 采集 ABA 所选周数据。可同时查看另一条采集路线。',action:'查看卖家精灵采集 →',flow:['提交采集','等待结果','确认来源覆盖'],result:'ABA 正反向采集已完成'},
{title:'卖家精灵拓词',desc:'复用紫鸟登录状态，采集最近 30 天词表；需要导入时核对字段映射。',action:'查看汇合条件，进入清洗',flow:['获取词表','确认映射','核对完整性'],result:'卖家精灵词表已确认'},
{title:'词频分析与清洗',group:'03　汇总、审核与发布',desc:'双路数据齐备后合并关键词文本。核对词根分类与排除项，保存审核结果。',action:'保存清洗审核，进入流量筛选',flow:['生成清洗快照','确认分类与排除','保存审核'],result:'词根分类与清洗审核已保存'},
{title:'筛选流量入口',desc:'参考 ABA 周指标，逐词或批量核对相关性、保留决定与优先级。',action:'保存流量审核，进入关键词库',flow:['生成筛选快照','审核关键词','保存决定'],result:'必审关键词已全部审核'},
{title:'层级填充与发布',desc:'复核第七步已处理的入库结果，确认后发布关键词库版本。',action:'确认并发布关键词库',flow:['查看入库结果','确认发布'],result:'关键词库 v1 已发布，可下载'}];
let active=3,current=3,completed=new Set([1,2]),collected=false,published=false;
const drafts={};
const el=id=>document.getElementById(id);
function notify(text){el('toast').textContent=text;el('toast').style.display='block';setTimeout(()=>el('toast').style.display='none',2400)}
function saveDraft(){document.querySelectorAll('[data-draft]').forEach(n=>drafts[n.dataset.draft]=n.type==='checkbox'?n.checked:n.value)}
function restore(){document.querySelectorAll('[data-draft]').forEach(n=>{if(n.dataset.draft in drafts){if(n.type==='checkbox')n.checked=drafts[n.dataset.draft];else n.value=drafts[n.dataset.draft]}})}
function field(label,key,value=''){return `<label class="field">${label}<input data-draft="${key}" value="${value}"></label>`}
function check(label,key,checked=true){return `<label class="check"><input type="checkbox" data-draft="${key}" ${checked?'checked':''}>${label}</label>`}
function render(){
const s=steps[active-1],c=steps[Math.min(current,8)-1];
el('current').innerHTML=published?`<div><span class="eyebrow">研究已完成</span><strong>关键词库 v1 已发布</strong><span class="muted">审核记录与来源证据已保留，可回看任意步骤。</span></div><button class="primary" data-go="8">查看发布结果</button>`:`<div><span class="eyebrow">${current===4?'系统正在执行':'需要你处理'} · 第 ${current} / 8 步</span><strong>${current===4?'ABA 与卖家精灵正在并行采集':c.title}</strong><span class="muted">${current===3?'下一步：核对候选竞对，填写保留或排除理由，然后保存。':current===4?'采集完成后汇入清洗；遇到导入或登录问题会提示处理。':c.desc}</span></div><button class="primary" data-go="${current}">${active===current?'查看当前操作 ↓':'去处理当前步骤 →'}</button>`;
el('nav').innerHTML=steps.map((v,i)=>`${v.group?`<div class="group">${v.group}</div>`:''}<button class="step ${active===i+1?'active':''} ${completed.has(i+1)?'done':''}" data-go="${i+1}" aria-current="${active===i+1?'step':'false'}"><span class="number">${completed.has(i+1)?'✓':i+1}</span><span><strong>${v.title}</strong><small>${completed.has(i+1)?'已完成':published?'已完成':i+1===current?(current===4?'系统采集中':'待你确认'):i+1>current?'尚未开始':'可查看'}</small></span></button>`).join('');
let body='';
if(active===1)body=`<div class="box"><h3>1. 核对识别的商品</h3><div class="grid">${field('商品名称','product','家用哑铃架')}${field('商品类型','type','Dumbbell Rack')}</div><p class="muted">确认商品名称、类型和特征后，再处理下面的词根。</p></div><div class="box"><h3>2. 核验并选择最小词根</h3>${check('dumbbell rack · 哑铃架','root1')}${check('weight rack · 重量架','root2')}<p class="muted">搜索核验只提供参考，最终选择由你保存。</p></div>`;
if(active===2)body=`<div class="box soft"><div class="box-heading"><h3>1. 读取 ABA 周报</h3><span class="badge">周报已读取 · 示例</span></div><p>2026-10-11 — 2026-10-17　／　按已确认词根查询</p></div><div class="box"><h3>2. 核对分析结果，选择核心大词</h3>${check('dumbbell rack　· 通用词 · 高相关','core1')}${check('weight rack　· 通用词 · 高相关','core2')}${check('dumbbell stand　· 通用词 · 高相关','core3')}${field('自家品牌（选填）','brands','')}</div>`;
if(active===3)body=`<div class="box soft"><div class="box-heading"><h3>1. 发现候选商品</h3><span class="badge">已发现 5 个候选 · 示例</span></div><p class="muted">来源：已确认核心词的前台搜索。你也可以补充 ASIN 或导入商机 CSV。</p><details><summary>补充候选：人工录入 / CSV 导入</summary>${field('补充 ASIN（多个以逗号分隔）','extra','')}<p>布局预览中仅保存输入，不进行真实搜索。</p></details></div><div class="box"><h3>2. 核对保留的竞对</h3><p class="muted">逐项核对同类款式与价格；保留和排除都需要理由。</p>${check('B0DEMO0001　家用三层哑铃架　$39.99　价格段内','asin1')}${check('B0DEMO0002　紧凑型哑铃架　$42.99　价格段内','asin2')}${check('B0DEMO0003　可调节哑铃架　$45.99　需核对价格','asin3',false)}<div class="grid" style="margin-top:15px">${field('参考价格（USD）','price','39.99')}${field('核对理由','reason','款式与用途一致，适合家用场景')}</div></div>`;
if(active===4||active===5)body=`<div class="cards"><div class="channel"><span class="eyebrow">路线 A · ABA</span><b>所选报告周</b><p class="muted">2026-10-11 — 2026-10-17</p><div class="progress"><i style="width:${collected?100:72}%"></i></div><span class="badge">${collected?'已完成':'正在采集 · 模拟'}</span><p>核心词正向 + 竞对 ASIN 反向</p><button class="secondary" data-go="4">查看 ABA 路线</button></div><div class="channel"><span class="eyebrow">路线 B · 卖家精灵</span><b>最近 30 天</b><p class="muted">复用紫鸟已登录会话</p><div class="progress"><i style="width:${collected?100:48}%"></i></div><span class="badge">${collected?'词表已确认':'正在获取词表 · 模拟'}</span><p>获取词表 → 核对映射 → 确认完整性</p><button class="secondary" data-go="5">查看卖家精灵路线</button></div></div><div class="hint">汇合条件：两路所需查询结果齐备后才能进入清洗。仅合并关键词文本，各来源的时间与指标口径分别保留。</div><div class="box"><h3>${active===4?'ABA：核对周报与来源覆盖':'卖家精灵：核对词表导入'}</h3><p class="muted">${active===4?'核心词 3 / 3　·　竞对反查 4 / 4（完成后的示例）':'正向词表 3 / 3　·　反向词表 4 / 4（完成后的示例）'}</p><button class="secondary" id="collect">模拟两路采集完成</button><details><summary>查看${active===4?'查询明细与失败任务':'字段映射与原始文件'}</summary><p>${active===4?'每个查询独立显示状态与失败原因，可定位需要补齐的任务。':'关键词 → keyword；月搜索量 → monthly_searches。实际使用中核对字段后确认，完整性以来源与导出声明为依据。'}</p></details></div>`;
if(active===6)body=`<div class="box soft"><h3>1. 双路数据已汇入清洗</h3><span class="metric">1,248</span> 个去重关键词<p class="muted">ABA 周报 + 卖家精灵最近 30 天词表 · 示例快照</p></div><div class="box"><h3>2. 确认分类与排除项</h3>${check('compact → 卖点词根','clean1')}${check('home gym → 场景属性','clean2')}${check('adjustable → 偏好属性','clean3')}${field('审核说明','cleanreason','已核对分类与来源，排除与商品无关词')}</div>`;
if(active===7)body=`<div class="box"><h3>1. 核对关键词与证据</h3><p class="muted">ABA 周报作为流量指标依据；款式、价格和相关性需要人工确认。</p>${check('dumbbell rack　· 保留　· 高优先级','traffic1')}${check('weight rack for home gym　· 保留　· 普通优先级','traffic2')}<div class="grid" style="margin-top:15px">${field('审核人','reviewer','')}${field('审核理由','trafficreason','款式相近，搜索意图与商品一致')}</div><details><summary>批量审核本页关键词</summary><p>选择关键词后统一填写决定与优先级，逐词证据仍保留。</p></details></div>`;
if(active===8)body=`<div class="box soft"><div class="box-heading"><h3>${published?'已发布版本 v1':'1. 查看入库结果'}</h3><span class="badge">${published?'已发布':'待复核'}</span></div><p><span class="metric">186</span> 个入库关键词</p><p class="muted">直接沿用第七步已处理的入库范围。以上数字为布局示例，不代表实际研究结果。</p></div><div class="box"><h3>2. 确认发布</h3><div class="grid" style="margin-top:15px">${field('发布人','publisher','')}${field('发布说明','publishreason','')}</div></div>`;
const blocked=active>current&&!published;
el('panel').innerHTML=`<div class="panel-head"><span class="eyebrow">STEP ${String(active).padStart(2,'0')} / 08　${completed.has(active)?'· 已完成，可回看':''}</span><h2>${s.title}</h2><p class="muted">${s.desc}</p><div class="flow">${s.flow.map((v,i)=>`<span class="${i===1?'focus':''}">${i+1}. ${v}</span>${i<2?'<span style="background:none;padding:7px 0">→</span>':''}`).join('')}</div>${blocked?`<div class="hint">这是后续步骤预览。请先完成第 ${current} 步「${c.title}」，当前内容不会提交。</div>`:''}</div><div class="content">${body}<details><summary>历史快照与审核记录</summary><p>正式页面将保留版本选择、审核记录与原始文件入口。主操作区默认使用当前有效快照。</p></details><details><summary>运行详情与来源证据</summary><p>模型任务、采集任务、来源时间口径与错误详情集中在这里，需要排查时再展开。</p></details></div><div class="footer"><button class="secondary" id="back" ${active===1?'disabled':''}>← 上一步</button><span class="muted">${published?'模拟发布完成':completed.has(active)?'这是已完成步骤，可继续回看':blocked?'先完成前置步骤':'完成本步后，引导你进入下一步'}</span><button class="primary" id="next">${published&&active===8?'下载示例词库':completed.has(active)?'查看下一步 →':blocked?'去处理当前步骤':s.action}</button></div>`;
restore();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));el('back').onclick=()=>go(active-1);el('next').onclick=advance;if(el('collect'))el('collect').onclick=()=>{saveDraft();collected=true;completed.add(4);completed.add(5);current=6;render();notify('模拟采集完成，下一步是清洗审核')};
}
function go(n){saveDraft();active=Math.max(1,Math.min(8,n));render()}
function advance(){saveDraft();if(published&&active===8){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff关键词,层级,备注\ndumbbell rack,核心词,布局预览示例\n'],{type:'text/csv;charset=utf-8'}));a.download='关键词库-布局预览示例.csv';a.click();URL.revokeObjectURL(a.href);return}if(active>current){go(current);return}if(completed.has(active)){go(active+1);return}if(active===4){go(5);return}if(active===5&&!collected){notify('请先点击“模拟两路采集完成”，再进入清洗');return}completed.add(active);notify(steps[active-1].result);if(active===8){published=true;render();return}current=active+1;active=current;render()}
el('scenario').onchange=e=>{saveDraft();current=Number(e.target.value);active=current;completed=new Set(Array.from({length:current-1},(_,i)=>i+1));collected=current>=6;published=false;render()};el('reset').onclick=()=>{Object.keys(drafts).forEach(k=>delete drafts[k]);current=3;active=3;completed=new Set([1,2]);collected=false;published=false;el('scenario').value='3';render()};render();
</script>
</body></html>
