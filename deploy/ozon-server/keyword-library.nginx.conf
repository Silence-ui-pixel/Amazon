limit_req_zone $binary_remote_addr zone=keyword_public_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name keyword-library.8.134.61.236.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name keyword-library.8.134.61.236.sslip.io;

    ssl_certificate /etc/letsencrypt/live/keyword-library.8.134.61.236.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keyword-library.8.134.61.236.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Keyword Library";
    auth_basic_user_file /etc/nginx/keyword-library.htpasswd;

    client_max_body_size 25m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/public/v1/ {
        auth_basic off;
        limit_req zone=keyword_public_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18081/api/public/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
