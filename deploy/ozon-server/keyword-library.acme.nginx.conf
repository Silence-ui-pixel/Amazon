# Bootstrap-only vhost used before the first TLS certificate exists.
# Once Certbot succeeds, replace this file with keyword-library.nginx.conf.
server {
    listen 80;
    listen [::]:80;
    server_name keyword-library.8.134.61.236.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
